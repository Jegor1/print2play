    <circle id="sucker2a" cx="175" cy="520" r="6" fill="#9B4FDE"/>
    <circle id="sucker2b" cx="188" cy="500" r="5" fill="#9B4FDE"/>
    <circle id="sucker3a" cx="333" cy="520" r="6" fill="#9B4FDE"/>
    <circle id="sucker3b" cx="322" cy="500" r="5" fill="#9B4FDE"/>
    <circle id="sucker4a" cx="418" cy="518" r="6" fill="#9B4FDE"/>
    <circle id="sucker4b" cx="400" cy="498" r="5" fill="#9B4FDE"/>
    <circle id="sucker4c" cx="385" cy="478" r="4" fill="#9B4FDE"/>

    <!-- Body main blob (covers tentacle tops) -->
    <path id="body" fill="#7B2FBE"
