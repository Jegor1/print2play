    <circle id="horn-tip-left" cx="158" cy="24" r="9" fill="#FFD93D"/>
    <circle cx="156" cy="21" r="3.5" fill="#FFF4B0" opacity="0.7"/>
    <circle id="horn-tip-right" cx="342" cy="24" r="9" fill="#FFD93D"/>
    <circle cx="344" cy="21" r="3.5" fill="#FFF4B0" opacity="0.7"/>

    <!-- Eye 1 (top-left, large) — no stroke, internal to body -->
