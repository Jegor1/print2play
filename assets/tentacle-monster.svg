      <circle cx="275" cy="268" r="7" fill="#1A6B3C"/>
      <circle cx="273" cy="264" r="3" fill="#ffffff"/>
    </g>

    <!-- Mouth — wobbly silly open mouth -->
    <path id="mouth" fill="#3D0F5C"
      d="M195,320 C205,310 220,308 250,310 C280,308 295,310 305,320 C300,355 280,375 250,378 C220,375 200,355 195,320 Z"/>
    <!-- Single snaggletooth hanging from top-left of mouth -->
    <path id="tooth1" fill="#ffffff"
      d="M218,318 Q222,338 228,318 Z"/>

    <!-- Cheek blush (no stroke) -->
    <ellipse id="blush-left" cx="148" cy="300" rx="22" ry="13" fill="#FF8FCF" opacity="0.35"/>
    <ellipse id="blush-right" cx="352" cy="300" rx="22" ry="13" fill="#FF8FCF" opacity="0.35"/>

    <!-- Small warts/bumps -->
    <circle id="wart1" cx="135" cy="255" r="5" fill="#6B25A8"/>
    <circle id="wart2" cx="370" cy="225" r="6" fill="#6B25A8"/>
    <circle id="wart3" cx="310" cy="390" r="4" fill="#6B25A8"/>
