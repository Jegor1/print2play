      <ellipse cx="236" cy="213" rx="12" ry="14" fill="#4CAF50"/>
      <circle cx="238" cy="210" r="6" fill="#1B5E20"/>
      <circle cx="240" cy="206" r="3" fill="#ffffff"/>
    </g>
    <g id="eye-top-right" data-size="medium">
      <ellipse cx="278" cy="210" rx="22" ry="24" fill="#FFFDE7"/>
      <ellipse cx="274" cy="213" rx="12" ry="14" fill="#4CAF50"/>
      <circle cx="272" cy="210" r="6" fill="#1B5E20"/>
      <circle cx="270" cy="206" r="3" fill="#ffffff"/>
    </g>
    <!-- Middle row (2 medium eyes) -->
    <g id="eye-mid-left" data-size="small">
