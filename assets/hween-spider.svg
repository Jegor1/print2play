    <path fill="none" stroke="#111111" stroke-width="3"
      d="M310,340 C332,358 362,382 385,405 C398,420 402,435 392,438 C380,440 360,425 338,405 C320,388 305,362 302,348"/>

    <!-- Body (covers leg joins) -->
    <ellipse id="abdomen" data-size="large" cx="255" cy="350" rx="75" ry="85" fill="#212121"/>
