    <path id="leg-l2" data-size="medium" fill="#212121"
      d="M190,275 C158,268 118,260 82,262 C62,264 52,275 60,285 C68,295 95,298 128,295 C155,292 180,282 190,278 Z"/>
    <path fill="none" stroke="#111111" stroke-width="3"
      d="M190,275 C158,268 118,260 82,262 C62,264 52,275 60,285 C68,295 95,298 128,295 C155,292 180,282 190,278"/>
    <path id="leg-l3" data-size="medium" fill="#212121"
      d="M192,310 C162,318 125,330 92,342 C72,350 62,362 72,370 C82,378 105,372 135,358 C160,345 182,325 192,315 Z"/>
    <path fill="none" stroke="#111111" stroke-width="3"
      d="M192,310 C162,318 125,330 92,342 C72,350 62,362 72,370 C82,378 105,372 135,358 C160,345 182,325 192,315"/>
    <path id="leg-l4" data-size="medium" fill="#212121"
