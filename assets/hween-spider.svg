      d="M180,350 C180,303 213,265 255,265 C297,265 330,303 330,350 C330,397 297,435 255,435 C213,435 180,397 180,350"/>

    <!-- Abdomen colorful spots -->
    <circle id="abd-spot1" data-size="small" cx="235" cy="330" r="12" fill="#E91E63" opacity="0.7"/>
    <circle id="abd-spot2" data-size="small" cx="278" cy="340" r="10" fill="#2196F3" opacity="0.7"/>
    <circle id="abd-spot3" data-size="small" cx="250" cy="375" r="14" fill="#FF9800" opacity="0.6"/>
    <circle id="abd-spot4" data-size="small" cx="225" cy="395" r="8" fill="#4CAF50" opacity="0.6"/>
    <circle id="abd-spot5" data-size="small" cx="280" cy="390" r="9" fill="#9C27B0" opacity="0.6"/>

