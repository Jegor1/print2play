    <!-- Silly smile -->
    <path id="mouth" data-size="small" fill="#424242"
      d="M235,285 C242,280 268,280 275,285 C272,295 265,302 255,304 C245,302 238,295 235,285 Z"/>
    <!-- Tiny pedipalps / cheek bumps -->
    <circle id="cheek-left" data-size="small" cx="225" cy="285" r="5" fill="#333333"/>
    <circle id="cheek-right" data-size="small" cx="285" cy="285" r="5" fill="#333333"/>

    <!-- Blush -->
    <ellipse id="blush-left" data-size="small" cx="208" cy="258" rx="12" ry="7" fill="#FF8FCF" opacity="0.3"/>
    <ellipse id="blush-right" data-size="small" cx="302" cy="258" rx="12" ry="7" fill="#FF8FCF" opacity="0.3"/>
