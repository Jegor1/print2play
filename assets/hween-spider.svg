    <path fill="none" stroke="#111111" stroke-width="3"
      d="M315,240 C345,220 385,198 420,190 C440,186 452,195 445,208 C438,220 415,232 385,242 C360,250 332,252 315,248"/>
    <path id="leg-r2" data-size="medium" fill="#212121"
      d="M320,275 C352,268 392,260 428,262 C448,264 458,275 450,285 C442,295 415,298 382,295 C355,292 330,282 320,278 Z"/>
    <path fill="none" stroke="#111111" stroke-width="3"
