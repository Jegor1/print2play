    <ellipse id="head-light" data-size="medium" cx="255" cy="225" rx="45" ry="48" fill="#333333"/>

    <!-- Multiple cute eyes (6 eyes, arranged in rows) -->
    <!-- Top row (2 big eyes) -->
    <g id="eye-top-left" data-size="medium">
