      <ellipse cx="288" cy="247" rx="8" ry="9" fill="#4CAF50"/>
      <circle cx="286" cy="245" r="4" fill="#1B5E20"/>
      <circle cx="285" cy="242" r="2" fill="#ffffff"/>
    </g>
    <!-- Bottom row (2 small eyes) -->
    <g id="eye-bot-left" data-size="small">
      <ellipse cx="238" cy="268" rx="10" ry="11" fill="#FFFDE7"/>
      <ellipse cx="240" cy="270" rx="6" ry="7" fill="#4CAF50"/>
      <circle cx="241" cy="268" r="3" fill="#1B5E20"/>
      <circle cx="242" cy="266" r="1.5" fill="#ffffff"/>
    </g>
    <g id="eye-bot-right" data-size="small">
      <ellipse cx="272" cy="268" rx="10" ry="11" fill="#FFFDE7"/>
      <ellipse cx="270" cy="270" rx="6" ry="7" fill="#4CAF50"/>
      <circle cx="269" cy="268" r="3" fill="#1B5E20"/>
      <circle cx="268" cy="266" r="1.5" fill="#ffffff"/>
