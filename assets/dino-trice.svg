    <!-- 3 rounded horns -->
    <path id="horn-top" data-size="medium" fill="#FFF9C4"
      d="M425,220 C428,200 432,178 435,162 C437,152 440,148 438,158 C436,172 432,195 428,218 Z"/>
    <path fill="none" stroke="#E65100" stroke-width="2"
      d="M425,220 C428,200 432,178 435,162 C437,152 440,148 438,158 C436,172 432,195 428,218"/>
    <path id="horn-left" data-size="small" fill="#FFF9C4"
      d="M395,238 C385,225 372,210 365,200 C360,194 362,190 368,196 C376,206 390,222 398,235 Z"/>
    <path fill="none" stroke="#E65100" stroke-width="2"
      d="M395,238 C385,225 372,210 365,200 C360,194 362,190 368,196 C376,206 390,222 398,235"/>
    <ellipse id="nose-horn" data-size="small" cx="472" cy="265" rx="8" ry="6" fill="#FFF9C4" transform="rotate(20 472 265)"/>

    <!-- Eye -->
    <g id="eye" data-size="medium">
      <ellipse cx="425" cy="258" rx="18" ry="20" fill="#FFFDE7"/>
      <ellipse cx="428" cy="261" rx="10" ry="12" fill="#4E342E"/>
      <circle cx="430" cy="258" r="5" fill="#1B0E06"/>
      <circle cx="432" cy="254" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Smile -->
    <path id="mouth" data-size="small" fill="#E65100"
      d="M450,290 C458,288 468,290 472,296 C470,305 460,310 450,308 C444,305 442,298 450,290 Z"/>

    <!-- Nostril -->
    <ellipse id="nostril" data-size="small" cx="475" cy="275" rx="3" ry="2.5" fill="#E65100"/>

    <!-- Blush -->
    <ellipse id="blush" data-size="small" cx="445" cy="300" rx="12" ry="7" fill="#FF8FCF" opacity="0.35"/>

    <!-- Body spots -->
    <circle id="spot1" data-size="small" cx="180" cy="340" r="12" fill="#F57C00" opacity="0.4"/>
    <circle id="spot2" data-size="small" cx="260" cy="370" r="9" fill="#F57C00" opacity="0.4"/>
    <circle id="spot3" data-size="small" cx="340" cy="350" r="10" fill="#F57C00" opacity="0.4"/>
