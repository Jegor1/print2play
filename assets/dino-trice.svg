    <!-- Frill spots -->
    <circle id="frill-spot1" data-size="small" cx="430" cy="210" r="10" fill="#FF9800" opacity="0.6"/>
    <circle id="frill-spot2" data-size="small" cx="460" cy="240" r="8" fill="#FF9800" opacity="0.6"/>
    <circle id="frill-spot3" data-size="small" cx="425" cy="270" r="9" fill="#FF9800" opacity="0.6"/>
    <circle id="frill-spot4" data-size="small" cx="395" cy="240" r="7" fill="#FF9800" opacity="0.6"/>

    <!-- Head -->
    <path id="head" data-size="large" fill="#FF9800"
