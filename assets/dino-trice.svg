    <path fill="none" stroke="#E65100" stroke-width="3.5"
      d="M300,415 C298,448 295,478 292,502 C290,516 287,530 302,532 C317,534 316,518 316,505 C318,478 319,448 319,418"/>
    <path id="leg-front-right" data-size="medium" fill="#FF9800"
      d="M355,412 C353,445 350,475 348,500 C346,514 343,528 358,530 C373,532 372,516 372,503 C373,475 374,445 374,415 Z"/>
    <path fill="none" stroke="#E65100" stroke-width="3.5"
      d="M355,412 C353,445 350,475 348,500 C346,514 343,528 358,530 C373,532 372,516 372,503 C373,475 374,445 374,415"/>

