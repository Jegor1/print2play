    <path id="ear-inner-left" data-size="small" fill="#FF8A80"
      d="M338,180 C335,158 330,138 328,128 C332,132 338,152 342,175 Z"/>
    <path id="ear-inner-right" data-size="small" fill="#FF8A80"
      d="M402,180 C404,158 408,138 410,128 C412,135 406,155 403,178 Z"/>

    <!-- Head -->
    <path id="head" data-size="large" fill="#424242"
      d="M370,175 C400,170 425,185 438,210 C448,232 445,260 432,280 C420,298 398,308 375,310 C352,312 332,302 322,285 C312,265 315,238 325,218 C335,198 352,180 370,175 Z"/>
    <path fill="none" stroke="#212121" stroke-width="3.5"
      d="M322,285 C312,265 315,238 325,218 C335,198 352,180 370,175 C400,170 425,185 438,210 C448,232 445,260 432,280 C420,298 398,308 375,310 C352,312 332,302 322,285"/>

    <!-- Big green eyes -->
    <g id="eye-left" data-size="medium">
      <ellipse cx="355" cy="235" rx="20" ry="22" fill="#E8F5E9"/>
      <ellipse cx="358" cy="238" rx="12" ry="14" fill="#4CAF50"/>
      <ellipse cx="360" cy="235" rx="6" ry="8" fill="#1B5E20"/>
      <circle cx="362" cy="231" r="3" fill="#ffffff"/>
    </g>
    <g id="eye-right" data-size="medium">
      <ellipse cx="405" cy="235" rx="20" ry="22" fill="#E8F5E9"/>
      <ellipse cx="402" cy="238" rx="12" ry="14" fill="#4CAF50"/>
      <ellipse cx="400" cy="235" rx="6" ry="8" fill="#1B5E20"/>
      <circle cx="398" cy="231" r="3" fill="#ffffff"/>
    </g>

    <!-- Nose -->
    <ellipse id="nose" data-size="small" cx="380" cy="262" rx="8" ry="5" fill="#FF8A80"/>

    <!-- Whiskers -->
    <line id="whisker-l1" data-size="small" x1="340" y1="258" x2="300" y2="250" stroke="#757575" stroke-width="1.5"/>
    <line id="whisker-l2" data-size="small" x1="340" y1="265" x2="298" y2="268" stroke="#757575" stroke-width="1.5"/>
    <line id="whisker-r1" data-size="small" x1="420" y1="258" x2="460" y2="250" stroke="#757575" stroke-width="1.5"/>
    <line id="whisker-r2" data-size="small" x1="420" y1="265" x2="462" y2="268" stroke="#757575" stroke-width="1.5"/>

    <!-- Small mouth -->
    <path id="mouth" data-size="small" fill="#212121"
      d="M370,272 C375,275 385,275 390,272 C388,280 382,284 380,284 C378,284 372,280 370,272 Z"/>

    <!-- Witch hat -->
    <path id="hat-brim" data-size="large" fill="#1A237E"
      d="M310,185 C320,195 340,200 370,200 C400,200 425,195 440,185 C448,180 450,172 442,168 C430,162 400,158 370,158 C340,158 310,162 298,168 C290,172 292,180 310,185 Z"/>
    <path id="hat-cone" data-size="large" fill="#1A237E"
      d="M330,168 C340,130 355,85 365,50 C370,35 375,30 378,45 C385,80 395,130 405,168 Z"/>
    <path fill="none" stroke="#0D1547" stroke-width="3"
      d="M310,185 C320,195 340,200 370,200 C400,200 425,195 440,185 C448,180 450,172 442,168 C430,162 400,158 370,158 C340,158 310,162 298,168 C290,172 292,180 310,185"/>
    <path fill="none" stroke="#0D1547" stroke-width="3"
      d="M330,168 C340,130 355,85 365,50 C370,35 375,30 378,45 C385,80 395,130 405,168"/>

    <!-- Hat buckle band -->
    <rect id="hat-band" data-size="small" x="328" y="158" width="80" height="14" rx="3" fill="#FF6D00"/>
    <!-- Buckle -->
    <rect id="hat-buckle" data-size="small" x="358" y="155" width="20" height="20" rx="3" fill="#FFD54F"/>
    <rect id="hat-buckle-inner" data-size="small" x="363" y="160" width="10" height="10" rx="2" fill="#1A237E"/>

    <!-- Stars on hat -->
    <circle id="star1" data-size="small" cx="350" cy="120" r="4" fill="#FFD54F" opacity="0.8"/>
    <circle id="star2" data-size="small" cx="385" cy="95" r="3" fill="#FFD54F" opacity="0.7"/>
    <circle id="star3" data-size="small" cx="365" cy="70" r="3.5" fill="#FFD54F" opacity="0.8"/>

    <!-- Blush -->
    <ellipse id="blush-left" data-size="small" cx="338" cy="270" rx="12" ry="7" fill="#FF8FCF" opacity="0.3"/>
    <ellipse id="blush-right" data-size="small" cx="422" cy="270" rx="12" ry="7" fill="#FF8FCF" opacity="0.3"/>
  </g>
</svg>
