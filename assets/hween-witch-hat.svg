    <!-- Belly/chest lighter -->
    <path id="chest" data-size="medium" fill="#616161"
      d="M330,290 C355,305 365,340 358,375 C352,400 335,420 312,428 C295,432 278,430 270,420 C260,405 262,380 272,355 C282,332 305,300 330,290 Z"/>

    <!-- Ears BEHIND hat but on top of body -->
    <path id="ear-left" data-size="medium" fill="#424242"
      d="M340,190 C335,160 325,130 322,115 C320,105 326,100 332,108 C340,120 348,150 350,180 Z"/>
    <path fill="none" stroke="#212121" stroke-width="3"
      d="M340,190 C335,160 325,130 322,115 C320,105 326,100 332,108 C340,120 348,150 350,180"/>
    <path id="ear-right" data-size="medium" fill="#424242"
      d="M400,190 C402,160 408,130 412,115 C414,105 420,100 418,112 C415,125 408,155 404,182 Z"/>
    <path fill="none" stroke="#212121" stroke-width="3"
      d="M400,190 C402,160 408,130 412,115 C414,105 420,100 418,112 C415,125 408,155 404,182"/>
