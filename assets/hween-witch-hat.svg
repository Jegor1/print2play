    <!-- Tail curl tip -->
    <path id="tail-tip" data-size="small" fill="#424242"
      d="M30,245 C22,228 18,210 25,200 C32,192 42,198 45,212 C48,225 40,240 30,245 Z"/>

    <!-- Back legs BEHIND body -->
    <path id="leg-back-left" data-size="medium" fill="#424242"
      d="M160,420 C155,450 148,478 142,502 C139,515 135,528 150,530 C165,532 163,516 164,505 C168,478 172,452 175,425 Z"/>
    <path fill="none" stroke="#212121" stroke-width="3.5"
      d="M160,420 C155,450 148,478 142,502 C139,515 135,528 150,530 C165,532 163,516 164,505 C168,478 172,452 175,425"/>
    <path id="leg-back-right" data-size="medium" fill="#424242"
      d="M215,422 C213,452 210,480 207,504 C205,517 202,530 217,532 C232,534 230,518 230,506 C232,480 233,452 234,426 Z"/>
    <path fill="none" stroke="#212121" stroke-width="3.5"
      d="M215,422 C213,452 210,480 207,504 C205,517 202,530 217,532 C232,534 230,518 230,506 C232,480 233,452 234,426"/>

    <!-- Front legs BEHIND body -->
    <path id="leg-front-left" data-size="medium" fill="#424242"
      d="M310,418 C308,448 305,476 302,500 C300,513 297,526 312,528 C327,530 325,514 325,503 C327,476 328,448 328,422 Z"/>
    <path fill="none" stroke="#212121" stroke-width="3.5"
      d="M310,418 C308,448 305,476 302,500 C300,513 297,526 312,528 C327,530 325,514 325,503 C327,476 328,448 328,422"/>
    <path id="leg-front-right" data-size="medium" fill="#424242"
      d="M365,415 C363,445 360,473 358,498 C356,511 353,524 368,526 C383,528 381,512 381,500 C382,473 383,445 383,419 Z"/>
    <path fill="none" stroke="#212121" stroke-width="3.5"
      d="M365,415 C363,445 360,473 358,498 C356,511 353,524 368,526 C383,528 381,512 381,500 C382,473 383,445 383,419"/>

    <!-- Paw details -->
    <ellipse id="paw-bl" data-size="small" cx="150" cy="530" rx="14" ry="5" fill="#616161"/>
    <ellipse id="paw-br" data-size="small" cx="218" cy="532" rx="14" ry="5" fill="#616161"/>
    <ellipse id="paw-fl" data-size="small" cx="312" cy="528" rx="14" ry="5" fill="#616161"/>
    <ellipse id="paw-fr" data-size="small" cx="368" cy="526" rx="14" ry="5" fill="#616161"/>

    <!-- Body (covers tail and leg joins) -->
    <path id="body" data-size="large" fill="#424242"
      d="M250,230 C310,222 375,240 405,280 C428,312 425,360 408,398 C395,425 368,445 335,450 C295,455 200,453 168,445 C138,435 115,415 102,388 C85,350 88,300 110,268 C135,232 200,225 250,230 Z"/>
    <path fill="none" stroke="#212121" stroke-width="3.5"
