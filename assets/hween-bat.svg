    <circle id="claw-l1" data-size="small" cx="215" cy="415" r="4" fill="#7B1FA2"/>
    <circle id="claw-l2" data-size="small" cx="210" cy="410" r="3.5" fill="#7B1FA2"/>
    <circle id="claw-r1" data-size="small" cx="295" cy="415" r="4" fill="#7B1FA2"/>
    <circle id="claw-r2" data-size="small" cx="300" cy="410" r="3.5" fill="#7B1FA2"/>

    <!-- Body (covers wing joins) -->
    <path id="body" data-size="large" fill="#4A148C"
      d="M255,170 C290,165 320,182 338,210 C352,235 352,270 342,300 C335,322 318,340 295,348 C275,355 235,355 215,348 C192,340 175,322 168,300 C158,270 158,235 172,210 C190,182 222,165 255,170 Z"/>
    <path fill="none" stroke="#311B92" stroke-width="3.5"
      d="M215,348 C192,340 175,322 168,300 C158,270 158,235 172,210 C190,182 222,165 255,170 C290,165 320,182 338,210 C352,235 352,270 342,300 C335,322 318,340 295,348"/>

    <!-- Belly lighter -->
    <path id="belly" data-size="medium" fill="#6A1B9A"
      d="M255,215 C280,212 302,225 312,248 C320,268 318,295 310,315 C304,330 292,340 276,342 C262,344 245,342 234,338 C218,330 208,315 202,295 C195,270 198,242 210,225 C222,212 240,210 255,215 Z"/>

    <!-- Big ears -->
    <path id="ear-left" data-size="medium" fill="#4A148C"
      d="M205,175 C195,145 180,108 172,85 C168,72 172,65 180,72 C190,82 202,115 210,150 Z"/>
    <path fill="none" stroke="#311B92" stroke-width="3"
      d="M205,175 C195,145 180,108 172,85 C168,72 172,65 180,72 C190,82 202,115 210,150"/>
    <path id="ear-right" data-size="medium" fill="#4A148C"
      d="M305,175 C315,145 330,108 338,85 C342,72 338,65 330,72 C320,82 308,115 300,150 Z"/>
    <path fill="none" stroke="#311B92" stroke-width="3"
      d="M305,175 C315,145 330,108 338,85 C342,72 338,65 330,72 C320,82 308,115 300,150"/>
    <!-- Inner ears -->
    <path id="ear-inner-left" data-size="small" fill="#7B1FA2"
      d="M205,168 C198,145 188,118 182,100 C186,105 198,135 206,160 Z"/>
    <path id="ear-inner-right" data-size="small" fill="#7B1FA2"
      d="M305,168 C312,145 322,118 328,100 C324,105 312,135 304,160 Z"/>

    <!-- Big cute eyes -->
    <g id="eye-left" data-size="large">
      <ellipse cx="228" cy="235" rx="28" ry="30" fill="#FFF9C4"/>
      <ellipse cx="232" cy="238" rx="16" ry="18" fill="#F44336"/>
      <circle cx="234" cy="235" r="9" fill="#B71C1C"/>
      <circle cx="237" cy="230" r="4" fill="#ffffff"/>
    </g>
    <g id="eye-right" data-size="large">
      <ellipse cx="282" cy="235" rx="28" ry="30" fill="#FFF9C4"/>
      <ellipse cx="278" cy="238" rx="16" ry="18" fill="#F44336"/>
      <circle cx="276" cy="235" r="9" fill="#B71C1C"/>
      <circle cx="273" cy="230" r="4" fill="#ffffff"/>
    </g>

    <!-- Tiny rounded fangs -->
    <path id="fang-left" data-size="small" fill="#ffffff"
      d="M238,300 Q242,315 246,300 Z"/>
    <path id="fang-right" data-size="small" fill="#ffffff"
      d="M264,300 Q268,315 272,300 Z"/>

    <!-- Small smile -->
    <path id="mouth" data-size="small" fill="#311B92"
      d="M232,295 C242,290 268,290 278,295 C275,305 265,312 255,314 C245,312 235,305 232,295 Z"/>

    <!-- Nose -->
    <ellipse id="nose" data-size="small" cx="255" cy="275" rx="6" ry="4" fill="#7B1FA2"/>

    <!-- Blush -->
    <ellipse id="blush-left" data-size="small" cx="200" cy="268" rx="14" ry="8" fill="#FF8FCF" opacity="0.3"/>
    <ellipse id="blush-right" data-size="small" cx="310" cy="268" rx="14" ry="8" fill="#FF8FCF" opacity="0.3"/>
  </g>
</svg>
