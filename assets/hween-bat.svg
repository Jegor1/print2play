<?xml version="1.0" standalone="yes"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 500 550" fill="none" stroke="none" stroke-linecap="round" stroke-linejoin="round">
  <g id="bat">
    <!-- Wings drawn BEHIND body -->
    <!-- Left wing -->
    <path id="wing-left" data-size="large" fill="#4A148C"
      d="M195,230 C155,205 95,170 40,155 C18,150 5,162 10,178 C18,200 50,230 85,252 C120,272 160,282 195,278 Z"/>
    <path fill="none" stroke="#311B92" stroke-width="3.5"
      d="M195,230 C155,205 95,170 40,155 C18,150 5,162 10,178 C18,200 50,230 85,252 C120,272 160,282 195,278"/>
    <!-- Left wing scalloped edge detail -->
    <path id="wing-left-edge" data-size="medium" fill="#4A148C"
      d="M40,155 C30,175 25,195 30,210 C20,200 12,185 10,178 Z
         M65,168 C58,188 55,210 60,225 C50,215 42,198 40,188 Z
         M95,182 C90,202 88,222 92,238 C82,228 75,210 72,200 Z"/>

    <!-- Right wing -->
    <path id="wing-right" data-size="large" fill="#4A148C"
      d="M315,230 C355,205 415,170 470,155 C492,150 505,162 500,178 C492,200 460,230 425,252 C390,272 350,282 315,278 Z"/>
    <path fill="none" stroke="#311B92" stroke-width="3.5"
      d="M315,230 C355,205 415,170 470,155 C492,150 505,162 500,178 C492,200 460,230 425,252 C390,272 350,282 315,278"/>
    <!-- Right wing scalloped edge -->
    <path id="wing-right-edge" data-size="medium" fill="#4A148C"
      d="M470,155 C480,175 485,195 480,210 C490,200 498,185 500,178 Z
         M445,168 C452,188 455,210 450,225 C460,215 468,198 470,188 Z
         M415,182 C420,202 422,222 418,238 C428,228 435,210 438,200 Z"/>

    <!-- Wing membrane lines -->
    <path id="membrane-l1" data-size="small" fill="none" stroke="#6A1B9A" stroke-width="1.5"
      d="M190,240 C145,218 85,190 45,175"/>
    <path id="membrane-l2" data-size="small" fill="none" stroke="#6A1B9A" stroke-width="1.5"
      d="M192,258 C150,242 100,218 65,205"/>
    <path id="membrane-r1" data-size="small" fill="none" stroke="#6A1B9A" stroke-width="1.5"
      d="M320,240 C365,218 425,190 465,175"/>
    <path id="membrane-r2" data-size="small" fill="none" stroke="#6A1B9A" stroke-width="1.5"
      d="M318,258 C360,242 410,218 445,205"/>

    <!-- Feet hanging down -->
    <path id="foot-left" data-size="small" fill="#4A148C"
      d="M225,340 C222,365 218,390 215,410 C213,420 218,425 224,418 C228,408 230,385 232,360 Z"/>
    <path fill="none" stroke="#311B92" stroke-width="2.5"
      d="M225,340 C222,365 218,390 215,410 C213,420 218,425 224,418 C228,408 230,385 232,360"/>
    <path id="foot-right" data-size="small" fill="#4A148C"
      d="M285,340 C288,365 292,390 295,410 C297,420 292,425 286,418 C282,408 280,385 278,360 Z"/>
    <path fill="none" stroke="#311B92" stroke-width="2.5"
      d="M285,340 C288,365 292,390 295,410 C297,420 292,425 286,418 C282,408 280,385 278,360"/>
