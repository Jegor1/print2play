    <circle id="spot1" data-size="small" cx="240" cy="300" r="8" fill="#7B1FA2" opacity="0.4"/>
    <circle id="spot2" data-size="small" cx="275" cy="330" r="6" fill="#7B1FA2" opacity="0.4"/>
    <circle id="spot3" data-size="small" cx="210" cy="265" r="7" fill="#7B1FA2" opacity="0.4"/>
