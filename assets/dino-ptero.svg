    <!-- Blush -->
    <ellipse id="blush-left" data-size="small" cx="252" cy="215" rx="14" ry="8" fill="#FF8FCF" opacity="0.35"/>
    <ellipse id="blush-right" data-size="small" cx="330" cy="218" rx="14" ry="8" fill="#FF8FCF" opacity="0.35"/>

