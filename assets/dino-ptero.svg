    <circle id="claw-l2" data-size="small" cx="210" cy="412" r="3" fill="#CE93D8"/>
    <circle id="claw-r1" data-size="small" cx="295" cy="416" r="3" fill="#CE93D8"/>
    <circle id="claw-r2" data-size="small" cx="300" cy="412" r="3" fill="#CE93D8"/>

