<?xml version="1.0" standalone="yes"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 500 550" fill="none" stroke="none" stroke-linecap="round" stroke-linejoin="round">
  <g id="stegosaurus">
    <!-- Tail drawn BEHIND body -->
    <path id="tail" data-size="large" fill="#2196F3"
      d="M80,310 C55,300 25,275 10,250 C0,232 8,220 20,228 C35,238 55,265 72,288 C82,300 90,308 95,315 Z"/>
    <path fill="none" stroke="#1565C0" stroke-width="3.5"
