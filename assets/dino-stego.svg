    <!-- Belly lighter -->
    <path id="belly" data-size="large" fill="#64B5F6"
      d="M250,260 C300,255 350,270 370,300 C385,325 382,360 370,385 C360,402 335,415 305,418 C270,422 220,420 190,415 C165,408 148,392 140,372 C130,345 135,305 155,280 C175,260 215,258 250,260 Z"/>

    <!-- Back plates (colorful, different sizes) - drawn ON TOP of body -->
    <path id="plate1" data-size="medium" fill="#FF9800"
      d="M145,225 C148,195 160,170 175,165 C185,162 188,175 182,195 C178,210 165,228 152,232 Z"/>
    <path id="plate2" data-size="large" fill="#E91E63"
      d="M195,205 C200,168 215,138 235,130 C248,126 252,142 244,168 C238,190 220,212 205,218 Z"/>
    <path id="plate3" data-size="large" fill="#FF9800"
      d="M248,195 C255,155 272,122 292,112 C306,107 310,125 302,155 C295,180 275,205 260,212 Z"/>
    <path id="plate4" data-size="large" fill="#E91E63"
      d="M302,200 C310,162 328,132 348,124 C362,120 365,138 356,165 C350,188 330,210 316,216 Z"/>
    <path id="plate5" data-size="medium" fill="#FF9800"
      d="M352,215 C358,188 370,165 385,160 C395,157 397,172 390,192 C385,208 372,225 360,228 Z"/>

    <!-- Small head -->
    <path id="head" data-size="large" fill="#2196F3"
      d="M410,260 C435,245 465,240 482,250 C495,258 498,278 488,298 C478,315 458,325 438,325 C418,325 402,315 398,298 C395,282 400,268 410,260 Z"/>
    <path fill="none" stroke="#1565C0" stroke-width="3.5"
      d="M398,298 C395,282 400,268 410,260 C435,245 465,240 482,250 C495,258 498,278 488,298 C478,315 458,325 438,325 C418,325 402,315 398,298"/>

    <!-- Head lighter -->
    <path id="head-belly" data-size="small" fill="#64B5F6"
      d="M430,265 C448,260 468,262 478,272 C485,280 484,294 476,302 C468,310 452,314 440,310 C428,306 422,295 424,282 C425,273 427,268 430,265 Z"/>

    <!-- Friendly eyes -->
    <g id="eye" data-size="medium">
      <ellipse cx="458" cy="270" rx="18" ry="20" fill="#FFFDE7"/>
      <ellipse cx="460" cy="273" rx="10" ry="12" fill="#4E342E"/>
      <circle cx="462" cy="270" r="5" fill="#1B0E06"/>
      <circle cx="464" cy="266" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Gentle smile -->
    <path id="mouth" data-size="small" fill="#1565C0"
      d="M470,295 C478,292 488,294 490,300 C488,308 478,312 468,310 C462,308 460,302 470,295 Z"/>

    <!-- Nostril -->
    <ellipse id="nostril" data-size="small" cx="490" cy="282" rx="3" ry="2.5" fill="#1565C0"/>

    <!-- Blush cheek -->
    <ellipse id="blush" data-size="small" cx="445" cy="305" rx="12" ry="7" fill="#FF8FCF" opacity="0.35"/>

    <!-- Body spots -->
    <circle id="spot1" data-size="small" cx="180" cy="350" r="10" fill="#1976D2" opacity="0.4"/>
    <circle id="spot2" data-size="small" cx="280" cy="370" r="8" fill="#1976D2" opacity="0.4"/>
    <circle id="spot3" data-size="small" cx="350" cy="340" r="12" fill="#1976D2" opacity="0.4"/>
    <circle id="spot4" data-size="small" cx="230" cy="310" r="7" fill="#1976D2" opacity="0.4"/>
  </g>
</svg>
