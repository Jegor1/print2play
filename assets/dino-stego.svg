    <path id="leg-back-right" data-size="medium" fill="#2196F3"
      d="M200,405 C198,440 195,472 192,500 C190,515 186,530 201,532 C216,534 215,518 215,505 C217,472 218,440 218,410 Z"/>
    <path fill="none" stroke="#1565C0" stroke-width="3.5"
      d="M200,405 C198,440 195,472 192,500 C190,515 186,530 201,532 C216,534 215,518 215,505 C217,472 218,440 218,410"/>
    <path id="leg-front-left" data-size="medium" fill="#2196F3"
      d="M310,400 C308,435 305,470 302,500 C300,515 296,530 311,532 C326,534 325,518 325,505 C327,470 328,440 328,410 Z"/>
    <path fill="none" stroke="#1565C0" stroke-width="3.5"
      d="M310,400 C308,435 305,470 302,500 C300,515 296,530 311,532 C326,534 325,518 325,505 C327,470 328,440 328,410"/>
    <path id="leg-front-right" data-size="medium" fill="#2196F3"
      d="M365,400 C363,435 360,468 358,498 C356,513 352,528 367,530 C382,532 380,516 380,503 C382,468 383,435 383,405 Z"/>
    <path fill="none" stroke="#1565C0" stroke-width="3.5"
      d="M365,400 C363,435 360,468 358,498 C356,513 352,528 367,530 C382,532 380,516 380,503 C382,468 383,435 383,405"/>

    <!-- Body (covers tail and leg joins) -->
    <path id="body" data-size="large" fill="#2196F3"
      d="M250,200 C310,190 380,210 410,260 C435,300 430,355 410,390 C395,415 365,430 330,435 C290,440 200,440 160,430 C125,420 100,400 88,370 C72,330 75,275 100,240 C130,200 195,195 250,200 Z"/>
    <path fill="none" stroke="#1565C0" stroke-width="3.5"
