    <!-- Tail spikes (rounded) -->
    <ellipse id="tail-spike1" data-size="small" cx="18" cy="238" rx="10" ry="18" fill="#FF7043" transform="rotate(-30 18 238)"/>
    <ellipse id="tail-spike2" data-size="small" cx="35" cy="258" rx="9" ry="16" fill="#FF5722" transform="rotate(-20 35 258)"/>
    <ellipse id="tail-spike3" data-size="small" cx="52" cy="275" rx="8" ry="14" fill="#FF7043" transform="rotate(-10 52 275)"/>
    <ellipse id="tail-spike4" data-size="small" cx="68" cy="290" rx="7" ry="12" fill="#FF5722" transform="rotate(-5 68 290)"/>

    <!-- Legs drawn BEHIND body -->
